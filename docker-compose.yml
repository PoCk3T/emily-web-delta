# Emily Web Delta — Docker Compose (Local Development)
# All services containerized for dev/prod parity.
#
# Services:
#   api      — FastAPI backend (uvicorn, port 8000)
#   worker   — Celery worker (self-hosted fallback polling)
#   beat     — Celery Beat scheduler
#   frontend — Nginx serving static React build
#   db       — PostgreSQL 16 (primary data store)
#   redis    — Redis 7 (cache, rate limiting, Celery broker)
#   minio    — MinIO (local S3-compatible object storage)

services:
  # ─── Backend API ───
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://emily:emily@db:5432/emily
      - REDIS_URL=redis://redis:6379/0
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - SECRET_KEY=dev-secret-key-change-in-prod
      - CLOAKBROWSER_PATH=/home/emily/.cloakbrowser/chromium-146.0.7680.177.4/chrome
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── Celery Worker (self-hosted fallback only) ───
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://emily:emily@db:5432/emily
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.celery_app worker --concurrency=1 --loglevel=info
    healthcheck:
      disable: true
    restart: unless-stopped

  # ─── Celery Beat (scheduler) ───
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://emily:emily@db:5432/emily
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.celery_app beat --schedule=/tmp/celerybeat-schedule --loglevel=info
    healthcheck:
      disable: true
    restart: unless-stopped

  # ─── Frontend (Nginx serves static React build) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    ports:
      - "80:80"
    depends_on:
      - api

  # ─── Database (PostgreSQL 16) ───
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=emily
      - POSTGRES_USER=emily
      - POSTGRES_PASSWORD=emily
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emily -d emily"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Cache / Celery Broker ───
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ─── Object Storage (local S3 alternative for dev) ───
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
